# OmniBuds version catalog.
#
# Phase 1 dependency policy (execution prompt section 34): every entry here needs
# a recorded reason, and each one is documented in
# docs/phases/phase-1/decisions.md plus docs/phases/phase-1/specs.md.
# Nothing was added because it is popular.

[versions]
kotlin = "2.0.21"
kotlinCoroutines = "1.9.0"
androidGradlePlugin = "8.7.3"
androidCompileSdk = "35"
androidMinSdk = "26"
androidTargetSdk = "35"
junitJupiter = "5.10.1"
junit4 = "4.13.2"
androidxTestRunner = "1.6.1"
androidxTestCore = "1.6.1"
androidxTestExtJunit = "1.2.1"

[libraries]
# ADR-P1-021 removed this from :core as unused; ADR-P2-003 restores it because
# adapter-state observation is a Flow surface, which is the trigger that was recorded.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinCoroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.10.1" }

# Phase 3 instrumented-device tests (ADR-P3-007). androidTest-only: none of these reaches
# `:core`, the production classpath, or `src/test`. JUnit 4 is here because Android's
# instrumentation runner and androidx.test.ext:junit are JUnit4-based; the project's JVM
# suites stay on Jupiter and the two never share a source set.
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
# ADR-P2-010: the debug-only harness target needs the application plugin. Debug variant only;
# the module is a device-bridge inspection target, not the product (ADR-P1-001 keeps the real
# application module out until Phase 49).
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
