org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# No machine-specific paths belong in this file. The Android SDK location is
# supplied by the git-ignored local.properties, and the JDK by JAVA_HOME in the
# invoking environment, so that this build stays reproducible on other machines
# and does not interfere with unrelated projects.
